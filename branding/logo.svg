<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="0.55" stop-color="#5b1a7a"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd6ec"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="512" cy="400" r="230"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- soleil rayé -->
  <g clip-path="url(#sunclip)">
    <rect x="262" y="150" width="500" height="520" fill="url(#sun)"/>
    <g fill="#5b1a7a">
      <rect x="262" y="470" width="500" height="14"/>
      <rect x="262" y="512" width="500" height="20"/>
      <rect x="262" y="558" width="500" height="26"/>
      <rect x="262" y="610" width="500" height="34"/>
    </g>
  </g>
  <!-- palmiers -->
  <g fill="#12062b">
    <path d="M190 760 C200 640 215 560 238 470 L250 472 C232 560 222 650 214 760 Z"/>
    <path d="M244 470 C200 430 150 430 110 455 C160 440 205 450 240 478 Z"/>
    <path d="M244 470 C230 420 190 395 150 395 C195 410 222 440 236 478 Z"/>
    <path d="M244 470 C270 425 320 410 360 420 C315 425 280 448 252 480 Z"/>
    <path d="M244 470 C290 455 340 470 370 500 C330 480 290 475 250 482 Z"/>
    <path d="M834 760 C824 650 812 580 792 510 L780 512 C796 585 806 655 810 760 Z"/>
    <path d="M786 508 C826 470 872 468 912 490 C866 478 826 488 792 516 Z"/>
    <path d="M786 508 C764 470 724 455 690 462 C730 470 758 490 778 516 Z"/>
    <path d="M786 508 C810 470 846 452 880 455 C842 465 812 488 794 518 Z"/>
  </g>
  <!-- sol -->
  <rect x="0" y="700" width="1024" height="324" fill="#12062b"/>
  <g stroke="#ff3d7f" stroke-width="4" opacity="0.55">
    <line x1="0" y1="740" x2="1024" y2="740"/><line x1="0" y1="800" x2="1024" y2="800"/>
    <line x1="512" y1="700" x2="512" y2="1024"/><line x1="380" y1="700" x2="160" y2="1024"/>
    <line x1="644" y1="700" x2="864" y2="1024"/><line x1="250" y1="700" x2="-200" y2="1024"/>
    <line x1="774" y1="700" x2="1224" y2="1024"/>
  </g>
  <!-- bouton lecture néon -->
  <g filter="url(#glow)">
    <path d="M450 310 L615 400 L450 490 Z" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  </g>
  <!-- texte -->
  <g filter="url(#glow)" font-family="Montserrat, Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="790" font-size="128" fill="url(#txt)" letter-spacing="6">VICE</text>
    <text x="512" y="872" font-size="70" fill="#ffe259" letter-spacing="16">REPLAY</text>
  </g>
</svg>
